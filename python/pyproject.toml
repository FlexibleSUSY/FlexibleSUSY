[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flexiblesusy"
version = "0.1.0"
description = "Python interface to spectrum generators created with FlexibleSUSY"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-or-later"}
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]
test = ["pytest"]

[tool.setuptools]
packages = ["flexiblesusy", "flexiblesusy.backends"]
