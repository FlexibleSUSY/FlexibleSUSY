name: tests

on:

  # branches together with paths-ignore work like 'or', not like 'and'
  # no idea how to fix it
  push:
    branches:
      - master
      - development
    paths-ignore:
      - '*.rst'
      - '.clang-tidy'
      - '.clang-format'
      - 'AUTHORS'
      - 'CITATION.cff'
      - 'COPYING'
      - 'doc/**'
      - 'install-sarah'
      - '.github/ISSUE_TEMPLATE/*'

  pull_request:
    branches:
      - master
      - development
    paths-ignore:
      - '*.rst'
      - '.clang-tidy'
      - '.clang-format'
      - 'AUTHORS'
      - 'CITATION.cff'
      - 'COPYING'
      - 'doc/**'
      - 'install-sarah'
      - '.github/ISSUE_TEMPLATE/*'

jobs:
  # Compiled and shell script tests that need neither Mathematica nor a
  # model, so they run even when the Wolfram Engine can't be activated.
  # No secrets are used, so this job also runs on pull requests from forks.
  no-meta:

    runs-on: ubuntu-latest
    container:
      image: navir/opensuseleap-for-flexiblesusy:0.18.10

    strategy:
      fail-fast: false
      matrix:
        CXXCOMPILER: [g++, clang++]

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: "Set FS dependency directory"
        env:
          compiler: ${{ matrix.CXXCOMPILER }}
        run: |
          case "$compiler" in
            "g++")    echo "FS_DEPENDENCIES_DIR=/fs_dependencies/gcc" >> $GITHUB_ENV ;;
            "clang++")  echo "FS_DEPENDENCIES_DIR=/fs_dependencies/clang" >> $GITHUB_ENV ;;
            *) exit 1 ;;
          esac

      - name: Configure
        env:
          CXXCOMPILER: ${{ matrix.CXXCOMPILER }}
        run: |
          ./configure \
            --with-cxx=$CXXCOMPILER \
            --with-loop-libraries=collier,looptools \
            --with-looptools-incdir=$FS_DEPENDENCIES_DIR/LoopTools/include \
            --with-looptools-libdir=$FS_DEPENDENCIES_DIR/LoopTools/lib64 \
            --with-collier-incdir=/fs_dependencies/gcc/COLLIER/include \
            --with-collier-libdir=/fs_dependencies/gcc/COLLIER/lib \
            --with-optional-modules=test \
            --disable-meta
          make showbuild

      - name: Make
        run: make -j2

      - name: Build compiled tests
        run: make -j2 alltest

      - name: Run compiled and shell script (Softsusy)
        # Makefile doesn't know about FLEXIBLESUSY_LOOP_LIBRARY flag so tests are not
        # re-run on FLEXIBLESUSY_LOOP_LIBRARY change. Every run must clean logs after itself.
        run: |
          FLEXIBLESUSY_LOOP_LIBRARY=0 make -j2 execute-compiled-tests execute-shell-tests
          make clean-test-log

      - name: Run compiled and shell script (Collier)
        run: |
          FLEXIBLESUSY_LOOP_LIBRARY=1 make -j2 execute-compiled-tests execute-shell-tests
          make clean-test-log

      - name: Run compiled and shell script (LoopTools)
        run: |
          FLEXIBLESUSY_LOOP_LIBRARY=2 make -j2 execute-compiled-tests execute-shell-tests
          make clean-test-log

      - name: Run compiled and shell script (fflite)
        run: |
          FLEXIBLESUSY_LOOP_LIBRARY=3 make -j2 execute-compiled-tests execute-shell-tests
          make clean-test-log

      - name: (Optional) Save logs in case of an error
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: no-meta-${{matrix.CXXCOMPILER}}_test-logs
          path: |
            config.*
            test/test_*.log

  # The no-meta tests on macOS with Apple clang (libc++), gfortran and the
  # libraries from Homebrew.  COLLIER and LoopTools aren't in Homebrew, so
  # they are built from source and cached.
  no-meta-macos:

    runs-on: macos-15

    env:
      COLLIER_VERSION: '1.2.10'
      LOOPTOOLS_VERSION: '2.16'
      DEPS_DIR: ${{ github.workspace }}/.fs_dependencies
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies from Homebrew
        run: |
          brew install gcc boost eigen gsl
          clang++ --version
          gfortran --version

      - name: Restore COLLIER and LoopTools
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPS_DIR }}
          key: macos-15-collier-${{ env.COLLIER_VERSION }}-looptools-${{ env.LOOPTOOLS_VERSION }}-v1

      - name: Build COLLIER and LoopTools
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$DEPS_DIR/src"
          cd "$DEPS_DIR/src"
          curl -sSfLO "https://collier.hepforge.org/downloads/collier-${COLLIER_VERSION}.tar.gz"
          curl -sSfLO "https://www.feynarts.de/looptools/LoopTools-${LOOPTOOLS_VERSION}.tar.gz"
          tar -xzf "collier-${COLLIER_VERSION}.tar.gz"
          cmake -S "collier-COLLIER-${COLLIER_VERSION}" -B collier-build -Dstatic=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_Fortran_COMPILER=gfortran \
            -DCMAKE_INSTALL_PREFIX="$DEPS_DIR/COLLIER"
          cmake --build collier-build -j3
          cmake --install collier-build
          tar -xzf "LoopTools-${LOOPTOOLS_VERSION}.tar.gz"
          cd "LoopTools-${LOOPTOOLS_VERSION}"
          FC=gfortran FFLAGS="-O2 -fPIC" CFLAGS="-O2 -fPIC" CXXFLAGS="-O2 -fPIC" \
            ./configure --prefix="$DEPS_DIR/LoopTools"
          make -j3
          make install
          cd "$DEPS_DIR"
          rm -rf src
          ls -R "$DEPS_DIR"

      - name: Configure
        run: |
          # LoopTools installs into lib or lib64
          looptools_libdir=$(dirname "$(find "$DEPS_DIR/LoopTools" -name 'libooptools.a' | head -n 1)")
          ./configure \
            --with-cxx=clang++ \
            --with-fc=gfortran \
            --with-loop-libraries=collier,looptools \
            --with-looptools-incdir="$DEPS_DIR/LoopTools/include" \
            --with-looptools-libdir="$looptools_libdir" \
            --with-collier-incdir="$DEPS_DIR/COLLIER/include" \
            --with-collier-libdir="$DEPS_DIR/COLLIER/lib" \
            --with-boost-incdir="$(brew --prefix boost)/include" \
            --with-boost-libdir="$(brew --prefix boost)/lib" \
            --with-eigen-incdir="$(brew --prefix eigen)/include/eigen3" \
            --with-gsl-config="$(brew --prefix gsl)/bin/gsl-config" \
            --with-optional-modules=test \
            --disable-meta
          make showbuild

      - name: Make
        run: make -j3

      - name: Build compiled tests
        run: make -j3 alltest

      - name: Run compiled and shell script (Softsusy)
        # -k: run all tests, so that one failure doesn't hide others
        run: |
          FLEXIBLESUSY_LOOP_LIBRARY=0 make -k -j3 execute-compiled-tests execute-shell-tests
          make clean-test-log

      - name: Run compiled and shell script (Collier)
        run: |
          FLEXIBLESUSY_LOOP_LIBRARY=1 make -k -j3 execute-compiled-tests execute-shell-tests
          make clean-test-log

      - name: Run compiled and shell script (LoopTools)
        run: |
          FLEXIBLESUSY_LOOP_LIBRARY=2 make -k -j3 execute-compiled-tests execute-shell-tests
          make clean-test-log

      - name: Run compiled and shell script (fflite)
        run: |
          FLEXIBLESUSY_LOOP_LIBRARY=3 make -k -j3 execute-compiled-tests execute-shell-tests
          make clean-test-log

      - name: (Optional) Save logs in case of an error
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: no-meta-macos_test-logs
          path: |
            config.*
            test/test_*.log

  with-meta:

    # Pull requests don't share secrets with a fork so we run tests only on PRs
    # comming from the FlexibleSUSY/FlexibleSUSY repo.
    # For non PR triggers we check for the name of the repo so that if someone
    # forks FS github doesn't try to run tests on their code.
    if: (!github.event.pull_request && github.repository == 'FlexibleSUSY/FlexibleSUSY') || github.event.pull_request.head.repo.url == 'https://api.github.com/repos/FlexibleSUSY/FlexibleSUSY'

    runs-on: ubuntu-latest
    container:
      image: navir/opensuseleap-for-flexiblesusy:0.18.10

    strategy:
      fail-fast: false
      matrix:
        CXXCOMPILER: [g++, clang++]
        PART:        [1, 2]

    env:
      FORMCALC_VERSION: '9.10'
      MODELS1: 'MSSM THDMII ScalarLeptoquarks MSSMCPV CMSSM E6SSM CMSSMNoFV CMSSMCPV CMSSMCKM MSSMNoFV NUHMSSMNoFVHimalaya CMSSMSemiAnalytic MSSMNoFVEFTHiggs UMSSM'
      MODELS2: 'MRSSM2 LRLR SM MRSSM2CKM S3 NMSSMCPV'

    steps:

      # action checks-out our repository directly under $GITHUB_WORKSPACE
      - name: Checkout
        uses: actions/checkout@v7

      - name: Activate Wolfram Engine
        env:
          MY_MATH_PASS:    ${{ secrets.MY_MATH_PASS }}
          MY_MAIL_ADDRESS: ${{ secrets.MY_MAIL_ADDRESS }}
        run: |
          wolframscript << EOF
          $MY_MAIL_ADDRESS
          $MY_MATH_PASS
          EOF
          printf "Checking if wolframscript command is workings... "; if [ $(wolframscript -code 1+2) -eq 3 ]; then echo OK; else echo fail && exit 1; fi

      - name: Install FormCalc
        run: |
          cd /fs_dependencies/gcc
          wget -q -O - https://feynarts.de/formcalc/FormCalc-$FORMCALC_VERSION.tar.gz | tar xzf -
          cd FormCalc-$FORMCALC_VERSION
          ./compile
          echo "AppendTo[\$Path, \"/fs_dependencies/gcc/FormCalc-$FORMCALC_VERSION\"];" >> /root/.WolframEngine/Kernel/init.m

      - name: Create models
        env:
          PART: ${{ matrix.PART }}
        run: |
          case "$PART" in
            "1") models=${MODELS1} ;;
            "2") models=${MODELS2} ;;
          esac
          for m in $models; do ./createmodel --name=$m; done

      - name: "Set FS dependency directory"
        env:
          compiler: ${{ matrix.CXXCOMPILER }}
        run: |
          case "$compiler" in
            "g++")    echo "FS_DEPENDENCIES_DIR=/fs_dependencies/gcc" >> $GITHUB_ENV ;;
            "clang++")  echo "FS_DEPENDENCIES_DIR=/fs_dependencies/clang" >> $GITHUB_ENV ;;
            *) exit 1 ;;
          esac

      - name: Configure
        env:
          CXXCOMPILER: ${{ matrix.CXXCOMPILER }}
          PART:        ${{ matrix.PART }}
        run: |
          case "$PART" in
            "1") models=${MODELS1} ;;
            "2") models=${MODELS2} ;;
          esac
          models=$(ruby -e "puts ARGV.join(',')" -- $models)
          ./configure \
            --with-cxx=$CXXCOMPILER \
            --with-models=$models \
            --with-loop-libraries=collier,looptools \
            --with-looptools-incdir=$FS_DEPENDENCIES_DIR/LoopTools/include \
            --with-looptools-libdir=$FS_DEPENDENCIES_DIR/LoopTools/lib64 \
            --with-collier-incdir=/fs_dependencies/gcc/COLLIER/include \
            --with-collier-libdir=/fs_dependencies/gcc/COLLIER/lib \
            --enable-higgstools \
            --with-higgstools-incdir=$FS_DEPENDENCIES_DIR/HiggsTools/include \
            --with-higgstools-libdir=$FS_DEPENDENCIES_DIR/HiggsTools/lib64 \
            --enable-lilith \
            --with-lilith=/fs_dependencies/Lilith \
            --enable-himalaya \
            --with-himalaya-incdir=$FS_DEPENDENCIES_DIR/Himalaya/include \
            --with-himalaya-libdir=$FS_DEPENDENCIES_DIR/Himalaya/lib64 \
            --enable-gm2calc \
            --with-gm2calc-incdir=$FS_DEPENDENCIES_DIR/GM2Calc/include \
            --with-gm2calc-libdir=$FS_DEPENDENCIES_DIR/GM2Calc/lib64 \
            --with-tsil-incdir=$FS_DEPENDENCIES_DIR/tsil \
            --with-tsil-libdir=$FS_DEPENDENCIES_DIR/tsil \
            --with-optional-modules=test \
            --enable-feynarts \
            --enable-formcalc \
            --enable-librarylink
          make showbuild

      - name: Check if SARAH has changed
        run: |
           out=$(find /fs_dependencies/mathematica/SARAH-* sarah -type f | xargs -d'\n' -P0 -n1 sha512sum | sort -k 2 | sha512sum | awk '{print $1}')
           echo "SARAH_HASH=${out}" >> $GITHUB_ENV

      # If SARAH checksum didn't change
      # restore content of Output directory from previous run
      - name: Restore cached SARAH outputs
        id: cache-sarah-output-restore
        uses: actions/cache/restore@v6
        with:
          path: Output
          key: sarah-outputs-${{ matrix.PART }}-${{ env.SARAH_HASH }}

      - name: Make
        run: make -j2

      - name: Save SARAH outputs
        id: cache-sarah-output-save
        uses: actions/cache/save@v6
        with:
          path: Output
          key: ${{ steps.cache-sarah-output-restore.outputs.cache-primary-key }}

      - name: Run Mathematica tests
        run: make -j2 execute-meta-tests

      - name: Build compiled tests
        run: make -j2 alltest

      # Having a single name entry and a bash loop over integers in the run tag would save a
      # little writing but splitting it into multiple entries makes it easier to see on github which loop
      # library has failed
      - name: Run compiled and shell script (Softsusy)
        # Makefile doesn't know about FLEXIBLESUSY_LOOP_LIBRARY flag so tests are not
        # re-run on FLEXIBLESUSY_LOOP_LIBRARY change. Every run must clean logs after itself.
        run: |
          FLEXIBLESUSY_LOOP_LIBRARY=0 make -j2 execute-compiled-tests execute-shell-tests
          make clean-test-log

      - name: Run compiled and shell script (Collier)
        run: |
          FLEXIBLESUSY_LOOP_LIBRARY=1 make -j2 execute-compiled-tests execute-shell-tests
          make clean-test-log

      - name: Run compiled and shell script (LoopTools)
        run: |
          FLEXIBLESUSY_LOOP_LIBRARY=2 make -j2 execute-compiled-tests execute-shell-tests
          make clean-test-log

      - name: Run compiled and shell script (fflite)
        run: |
          FLEXIBLESUSY_LOOP_LIBRARY=3 make -j2 execute-compiled-tests execute-shell-tests
          make clean-test-log

      - name: Testing without FormCalc
        if: ${{ matrix.PART == 2 }}
        env:
          CXXCOMPILER: ${{ matrix.CXXCOMPILER }}
        run: |
          ./configure \
            --with-cxx=$CXXCOMPILER \
            --with-models=SM,MRSSM2 \
            --with-loop-libraries=collier,looptools \
            --with-looptools-incdir=$FS_DEPENDENCIES_DIR/LoopTools/include \
            --with-looptools-libdir=$FS_DEPENDENCIES_DIR/LoopTools/lib64 \
            --with-collier-incdir=/fs_dependencies/gcc/COLLIER/include \
            --with-collier-libdir=/fs_dependencies/gcc/COLLIER/lib \
            --enable-higgstools \
            --with-higgstools-incdir=$FS_DEPENDENCIES_DIR/HiggsTools/include \
            --with-higgstools-libdir=$FS_DEPENDENCIES_DIR/HiggsTools/lib64 \
            --enable-lilith \
            --with-lilith=/fs_dependencies/Lilith \
            --enable-himalaya \
            --with-himalaya-incdir=$FS_DEPENDENCIES_DIR/Himalaya/include \
            --with-himalaya-libdir=$FS_DEPENDENCIES_DIR/Himalaya/lib64 \
            --enable-gm2calc \
            --with-gm2calc-incdir=$FS_DEPENDENCIES_DIR/GM2Calc/include \
            --with-gm2calc-libdir=$FS_DEPENDENCIES_DIR/GM2Calc/lib64 \
            --with-tsil-incdir=$FS_DEPENDENCIES_DIR/tsil \
            --with-tsil-libdir=$FS_DEPENDENCIES_DIR/tsil \
            --with-optional-modules=test \
            --enable-feynarts \
            --disable-formcalc \
            --enable-librarylink
          make -j2
          make -j2 execute-meta-tests
          make -j2 alltest
          for i in {0..3}
          do
            FLEXIBLESUSY_LOOP_LIBRARY=$i make -j2 execute-compiled-tests execute-shell-tests
            make clean-test-log
          done

      - name: Testing without Feynarts and FormCalc
        if: ${{ matrix.PART == 2 }}
        env:
          CXXCOMPILER: ${{ matrix.CXXCOMPILER }}
        run: |
          ./configure \
            --with-cxx=$CXXCOMPILER \
            --with-models=SM,MRSSM2 \
            --with-loop-libraries=collier,looptools \
            --with-looptools-incdir=$FS_DEPENDENCIES_DIR/LoopTools/include \
            --with-looptools-libdir=$FS_DEPENDENCIES_DIR/LoopTools/lib64 \
            --with-collier-incdir=/fs_dependencies/gcc/COLLIER/include \
            --with-collier-libdir=/fs_dependencies/gcc/COLLIER/lib \
            --enable-higgstools \
            --with-higgstools-incdir=$FS_DEPENDENCIES_DIR/HiggsTools/include \
            --with-higgstools-libdir=$FS_DEPENDENCIES_DIR/HiggsTools/lib64 \
            --enable-lilith \
            --with-lilith=/fs_dependencies/Lilith \
            --enable-himalaya \
            --with-himalaya-incdir=$FS_DEPENDENCIES_DIR/Himalaya/include \
            --with-himalaya-libdir=$FS_DEPENDENCIES_DIR/Himalaya/lib64 \
            --enable-gm2calc \
            --with-gm2calc-incdir=$FS_DEPENDENCIES_DIR/GM2Calc/include \
            --with-gm2calc-libdir=$FS_DEPENDENCIES_DIR/GM2Calc/lib64 \
            --with-tsil-incdir=$FS_DEPENDENCIES_DIR/tsil \
            --with-tsil-libdir=$FS_DEPENDENCIES_DIR/tsil \
            --with-optional-modules=test \
            --disable-feynarts \
            --disable-formcalc \
            --enable-librarylink
          make -j2
          make -j2 execute-meta-tests
          make -j2 alltest
          for i in {0..3}
          do
            FLEXIBLESUSY_LOOP_LIBRARY=$i make -j2 execute-compiled-tests execute-shell-tests
            make clean-test-log
          done

      - name: Testing pack-SM-src
        if: ${{ matrix.PART == 2 }}
        env:
          CXXCOMPILER: ${{ matrix.CXXCOMPILER }}
        run: |
          rm -rf models/SM
          ./createmodel --name=SM
          ./configure \
            --with-cxx=$CXXCOMPILER \
            --with-models=SM \
            --with-loop-libraries=collier,looptools \
            --with-looptools-incdir=$FS_DEPENDENCIES_DIR/LoopTools/include \
            --with-looptools-libdir=$FS_DEPENDENCIES_DIR/LoopTools/lib64 \
            --with-collier-incdir=/fs_dependencies/gcc/COLLIER/include \
            --with-collier-libdir=/fs_dependencies/gcc/COLLIER/lib \
            --with-optional-modules=test \
            --enable-feynarts \
            --enable-formcalc \
            --disable-compile
          make -j2
          make pack-SM-src
          rm -rf models/SM
          tar -xf SM.tar.gz
          ./configure \
            --with-cxx=$CXXCOMPILER \
            --with-models=SM \
            --with-loop-libraries=collier,looptools \
            --with-looptools-incdir=$FS_DEPENDENCIES_DIR/LoopTools/include \
            --with-looptools-libdir=$FS_DEPENDENCIES_DIR/LoopTools/lib64 \
            --with-collier-incdir=/fs_dependencies/gcc/COLLIER/include \
            --with-collier-libdir=/fs_dependencies/gcc/COLLIER/lib \
            --with-optional-modules=test \
            --enable-feynarts \
            --enable-formcalc \
            --disable-meta
          make -j2
          make -j2 execute-meta-tests
          make -j2 alltest
          for i in {0..3}
          do
            FLEXIBLESUSY_LOOP_LIBRARY=$i make -j2 execute-compiled-tests execute-shell-tests
            make clean-test-log
          done

      - name: (Optional) Save logs in case of an error
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{matrix.CXXCOMPILER}}-${{matrix.PART}}_test-logs
          path: |
            config.*
            test/test_*.log

